<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Host Monitor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="{{ url_for('home') }}">Host Monitor</a>
      {% if session.get('user') %}
      <nav aria-label="Primary">
        <a class="nav-link{% if request.endpoint in ['home', 'server_detail'] %} is-current{% endif %}" href="{{ url_for('home') }}"{% if request.endpoint == 'home' %} aria-current="page"{% endif %}>Dashboard</a>
        <a class="nav-link{% if request.endpoint == 'server_new' %} is-current{% endif %}" href="{{ url_for('server_new') }}"{% if request.endpoint == 'server_new' %} aria-current="page"{% endif %}>Add server</a>
        <form method="post" action="{{ url_for('logout') }}">
          <button class="ghost" type="submit">Log out</button>
        </form>
      </nav>
      {% endif %}
    </header>
    <main>
      {% block main %}{% endblock %}
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
