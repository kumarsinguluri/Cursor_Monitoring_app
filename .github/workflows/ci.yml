name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-not-a-secret
      # Dummy hash so the app can start in CI. Not a real password.
      ADMIN_PASSWORD_HASH: 'scrypt:32768:8:1$MyBbVICSo9jpQYkn$6af8ca49a37c7a5a11772c3fdfa9d4e4be035624b9154e2135bcd9757076fc980675ff20cc8aef3992b662e5427a6f64263cca1a131046a719cb0a22acc07709'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
